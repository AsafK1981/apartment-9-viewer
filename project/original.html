(function(){'use strict';const image=document.getElementById('plan'),v=document.getElementById('viewport'),label=document.getElementById('zoom-label');let ready=false,scale=1,fitScale=1,gesture=null;const pointers=new Map();
function point(c){const r=image.getBoundingClientRect();return{x:(c.x-r.left)/scale,y:(c.y-r.top)/scale};}
function middle(){const r=v.getBoundingClientRect();return{x:r.left+v.clientWidth/2,y:r.top+v.clientHeight/2};}
function layout(){image.style.width=image.naturalWidth*scale+'px';image.style.height=image.naturalHeight*scale+'px';label.textContent=Math.round(scale*100)+'%';}
function setScale(next,anchor,client){if(!ready)return;client=client||middle();anchor=anchor||point(client);scale=Math.max(fitScale,Math.min(8,next));layout();const r=image.getBoundingClientRect();v.scrollLeft+=r.left+anchor.x*scale-client.x;v.scrollTop+=r.top+anchor.y*scale-client.y;}
function fit(){if(!ready)return;fitScale=Math.max(.03,Math.min(1,(v.clientWidth-40)/image.naturalWidth,(v.clientHeight-40)/image.naturalHeight));scale=fitScale;layout();v.scrollLeft=0;v.scrollTop=0;}
function resetGesture(){if(pointers.size===1){const [p]=pointers.values();gesture={kind:'pan',x:p.x,y:p.y,left:v.scrollLeft,top:v.scrollTop};}else if(pointers.size===2){const [a,b]=pointers.values(),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};gesture={kind:'pinch',distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),scale,anchor:point(mid)};}else gesture=null;}
v.addEventListener('pointerdown',e=>{if(!ready||e.button!==0)return;e.preventDefault();v.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});v.classList.add('dragging');resetGesture();});
v.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gesture.kind==='pan'){v.scrollLeft=gesture.left+gesture.x-e.clientX;v.scrollTop=gesture.top+gesture.y-e.clientY;}else if(pointers.size===2){const [a,b]=pointers.values(),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};setScale(gesture.scale*Math.hypot(a.x-b.x,a.y-b.y)/gesture.distance,gesture.anchor,mid);}});
function release(e){if(!pointers.delete(e.pointerId))return;try{v.releasePointerCapture(e.pointerId);}catch(_){}resetGesture();if(!pointers.size)v.classList.remove('dragging');}
for(const name of ['pointerup','pointercancel','lostpointercapture'])v.addEventListener(name,release);
v.addEventListener('wheel',e=>{if(!ready)return;e.preventDefault();setScale(scale*Math.exp(-e.deltaY*.0015),null,{x:e.clientX,y:e.clientY});},{passive:false});
document.getElementById('zoom-in').onclick=()=>setScale(scale*1.35);document.getElementById('zoom-out').onclick=()=>setScale(scale/1.35);document.getElementById('fit').onclick=fit;document.getElementById('actual').onclick=()=>setScale(1);
function init(){if(ready||!image.naturalWidth)return;const raw=atob(image.src.slice(image.src.indexOf(',')+1)),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);document.getElementById('download-original').href=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));ready=true;fit();window.originalReferenceReady=true;}
image.addEventListener('load',init);image.addEventListener('error',()=>{document.querySelector('.footer').textContent='לא ניתן לטעון את קובץ המקור.';});if(image.complete)init();new ResizeObserver(()=>{if(ready)fit();}).observe(v);window.originalReference={getState:()=>({ready,scale,fitScale,naturalWidth:image.naturalWidth,naturalHeight:image.naturalHeight})};
})();</script></body></html>
